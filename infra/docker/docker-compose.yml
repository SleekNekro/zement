# Entorno LOCAL de la tienda Zement (PrestaShop + MySQL).
# Versión alineada con la que se instalará en IONOS Hosting Plus.
# Arranque: pnpm tienda:up  (desde la raíz del repo)
name: zement

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - '127.0.0.1:3307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_ROOT_PASSWD}']
      interval: 5s
      timeout: 5s
      retries: 30

  prestashop:
    image: prestashop/prestashop:${PS_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_SERVER: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWD}
      DB_PREFIX: zm_
      PS_INSTALL_AUTO: 1
      PS_DOMAIN: localhost:8090
      PS_LANGUAGE: es
      PS_COUNTRY: ES
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN}
      PS_FOLDER_INSTALL: install-dev
      PS_ENABLE_SSL: 0
      PS_DEV_MODE: 1
      ADMIN_MAIL: ${ADMIN_MAIL}
      ADMIN_PASSWD: ${ADMIN_PASSWD}
    ports:
      - '127.0.0.1:8090:80'
    volumes:
      - prestashop-data:/var/www/html
      # Tema hijo versionado en Git (se edita en apps/tienda/theme/zement).
      - ../../apps/tienda/theme/zement:/var/www/html/themes/zement
      # Módulos propios versionados en Git (apps/tienda/modules).
      - ../../apps/tienda/modules/zementhome:/var/www/html/modules/zementhome

volumes:
  mysql-data:
  prestashop-data:
