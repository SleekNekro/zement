<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width"
    />
    <title>Zement</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f5f0e6;
      font-family: Arial, Helvetica, sans-serif;
      color: #0f1c26;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f5f0e6; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 560px; width: 100%; background: #ffffff; border: 1px solid #d9d3c7"
          >
            <tr>
              <td
                style="
                  padding: 28px 32px;
                  border-bottom: 3px solid #b99a57;
                  font-size: 22px;
                  letter-spacing: 0.02em;
                  color: #2d4f70;
                "
              >
                zement<span style="font-size: 15px">.com</span>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 32px; font-size: 15px; line-height: 1.6">
                <p style="margin: 0 0 16px">Hei {firstname},</p>
                <p style="margin: 0 0 16px">
                  Ammattilaistilisi ei ole enää käytössä. Tästä lähtien näet verkkokaupassa
                  kuluttajahinnat.
                </p>
                <p style="margin: 0">
                  Jos uskot tämän olevan virhe tai haluat hakea uudelleen, vastaa tähän viestiin tai
                  kirjoita osoitteeseen {contact_email}.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
