<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width"
    />
    <title>Zement</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f5f0e6;
      font-family: Arial, Helvetica, sans-serif;
      color: #0f1c26;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f5f0e6; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 560px; width: 100%; background: #ffffff; border: 1px solid #d9d3c7"
          >
            <tr>
              <td
                style="
                  padding: 28px 32px;
                  border-bottom: 3px solid #b99a57;
                  font-size: 22px;
                  letter-spacing: 0.02em;
                  color: #2d4f70;
                "
              >
                zement<span style="font-size: 15px">.com</span>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 32px; font-size: 15px; line-height: 1.6">
                <p style="margin: 0 0 16px">
                  Hay una solicitud nueva de cuenta profesional en la tienda.
                </p>
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  style="font-size: 15px"
                >
                  <tr>
                    <td style="padding: 6px 16px 6px 0; color: #5b6670">Razón social</td>
                    <td style="padding: 6px 0">{company}</td>
                  </tr>
                  <tr>
                    <td style="padding: 6px 16px 6px 0; color: #5b6670">CIF / NIF-IVA</td>
                    <td style="padding: 6px 0">{vat}</td>
                  </tr>
                  <tr>
                    <td style="padding: 6px 16px 6px 0; color: #5b6670">Tipo</td>
                    <td style="padding: 6px 0">{type}</td>
                  </tr>
                  <tr>
                    <td style="padding: 6px 16px 6px 0; color: #5b6670">Contacto</td>
                    <td style="padding: 6px 0">{firstname} {lastname}</td>
                  </tr>
                  <tr>
                    <td style="padding: 6px 16px 6px 0; color: #5b6670">Correo</td>
                    <td style="padding: 6px 0">{email}</td>
                  </tr>
                  <tr>
                    <td style="padding: 6px 16px 6px 0; color: #5b6670">Idioma</td>
                    <td style="padding: 6px 0">{language}</td>
                  </tr>
                </table>
                <p style="margin: 24px 0 0">
                  Revísela en el panel: Clientes → Solicitudes profesionales.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
