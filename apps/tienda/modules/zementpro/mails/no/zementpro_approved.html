<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width"
    />
    <title>Zement</title>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f5f0e6;
      font-family: Arial, Helvetica, sans-serif;
      color: #0f1c26;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="background: #f5f0e6; padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="560"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 560px; width: 100%; background: #ffffff; border: 1px solid #d9d3c7"
          >
            <tr>
              <td
                style="
                  padding: 28px 32px;
                  border-bottom: 3px solid #b99a57;
                  font-size: 22px;
                  letter-spacing: 0.02em;
                  color: #2d4f70;
                "
              >
                zement<span style="font-size: 15px">.com</span>
              </td>
            </tr>
            <tr>
              <td style="padding: 28px 32px; font-size: 15px; line-height: 1.6">
                <p style="margin: 0 0 16px">Hei {firstname},</p>
                <p style="margin: 0 0 16px">
                  Den profesjonelle kontoen din er nå aktiv som <strong>{type}</strong>. Når du
                  logger inn i nettbutikken, ser du prisene dine eks. mva. på hvert produkt.
                </p>
                <p style="margin: 28px 0 8px">
                  <a
                    href="{shop_url}"
                    style="
                      display: inline-block;
                      padding: 12px 22px;
                      background: #2d4f70;
                      color: #ffffff;
                      text-decoration: none;
                      font-size: 13px;
                      letter-spacing: 0.12em;
                      text-transform: uppercase;
                    "
                    >Gå til nettbutikken</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
